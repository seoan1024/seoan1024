<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Hanok LLM modular stack</title>
  <desc id="desc">Modular model, data, training, inference, and evaluation components with training and inference efficiency features.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <style>
      @media (prefers-reduced-motion: no-preference) {
        .module-border { animation: glow 4s ease-in-out infinite alternate; }
        .module-border-2 { animation-delay: 1.3s; }
        .module-border-3 { animation-delay: 2.6s; }
        .module-flow { stroke-dasharray: 7 9; animation: flow 10s linear infinite; }
        .stack-title { transform-box: fill-box; transform-origin: left center; animation: title-wave 2.5s ease-in-out infinite alternate; }
        .stack-label { animation: blink 1.8s steps(2, jump-none) infinite; }
        .stack-label-2 { animation-delay: -.6s; }
        .stack-label-3 { animation-delay: -1.2s; }
      }
      @keyframes glow { to { stroke-opacity: .45; } }
      @keyframes flow { to { stroke-dashoffset: -64; } }
      @keyframes title-wave { to { transform: translateY(-7px); fill: #67e8f9; } }
      @keyframes blink { 50% { opacity: .25; } }
    </style>
  </defs>
  <rect width="1200" height="610" rx="24" fill="#0b1220" stroke="#334155"/>
  <text class="stack-title" x="55" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="800" fill="#f8fafc">HANOK LLM / MODULAR STACK</text>
  <text x="55" y="83" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#94a3b8">A clearer structure, building on Korean-llm experiments</text>
  <g font-family="Segoe UI,Arial,sans-serif">
    <g transform="translate(60 116)"><rect class="module-border" width="330" height="132" rx="18" fill="#111827" stroke="#6d28d9"/><text class="stack-label" x="22" y="34" font-size="13" font-weight="800" fill="#c4b5fd">MODEL</text><text x="22" y="68" font-size="22" font-weight="800" fill="#fff">Decoder Transformer</text><text x="22" y="99" font-size="14" fill="#cbd5e1">RMSNorm · RoPE · SwiGLU</text><text x="22" y="120" font-size="13" fill="#94a3b8">Tied embeddings · KV cache</text></g>
    <g transform="translate(435 116)"><rect class="module-border module-border-2" width="330" height="132" rx="18" fill="#111827" stroke="#0e7490"/><text class="stack-label stack-label-2" x="22" y="34" font-size="13" font-weight="800" fill="#67e8f9">DATA</text><text x="22" y="68" font-size="22" font-weight="800" fill="#fff">Dataset pipeline</text><text x="22" y="99" font-size="14" fill="#cbd5e1">Loading · caching · parsing</text><text x="22" y="120" font-size="13" fill="#94a3b8">Pretraining · response-only SFT</text></g>
    <g transform="translate(810 116)"><rect class="module-border module-border-3" width="330" height="132" rx="18" fill="#111827" stroke="#15803d"/><text class="stack-label stack-label-3" x="22" y="34" font-size="13" font-weight="800" fill="#86efac">TRAINING</text><text x="22" y="68" font-size="22" font-weight="800" fill="#fff">Train and resume</text><text x="22" y="99" font-size="14" fill="#cbd5e1">Pretraining · SFT · validation</text><text x="22" y="120" font-size="13" fill="#94a3b8">Checkpoints · CLI · optional GUI</text></g>
    <path class="module-flow" d="M390 182h45M765 182h45" stroke="url(#accent)" stroke-width="3"/>
    <g transform="translate(60 285)"><rect width="515" height="230" rx="18" fill="#0f172a" stroke="#334155"/><text x="24" y="39" font-size="13" font-weight="800" fill="#c4b5fd">EFFICIENCY FEATURES</text><text x="24" y="79" font-size="21" font-weight="800" fill="#f8fafc">Training</text><text x="24" y="112" font-size="15" fill="#cbd5e1">• BF16 autocast on supported CUDA devices</text><text x="24" y="143" font-size="15" fill="#cbd5e1">• Gradient checkpointing</text><text x="24" y="174" font-size="15" fill="#cbd5e1">• Optional 8-bit AdamW with fallback</text><text x="24" y="207" font-size="12" fill="#64748b">Features are implemented; speedups are not benchmarked here.</text></g>
    <g transform="translate(625 285)"><rect width="515" height="230" rx="18" fill="#0f172a" stroke="#334155"/><text x="24" y="39" font-size="13" font-weight="800" fill="#67e8f9">INFERENCE &amp; EVALUATION</text><text x="24" y="79" font-size="21" font-weight="800" fill="#f8fafc">Generate · measure · improve</text><text x="24" y="112" font-size="15" fill="#cbd5e1">• Autoregressive generation with KV cache</text><text x="24" y="143" font-size="15" fill="#cbd5e1">• Sampling controls for local inference</text><text x="24" y="174" font-size="15" fill="#cbd5e1">• Perplexity utility and training validation</text><text x="24" y="207" font-size="12" fill="#64748b">Model quality and performance need reproducible evaluation.</text></g>
  </g>
  <text x="600" y="565" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#94a3b8">Separate modules make the system easier to understand, extend, and test.</text>
</svg>
