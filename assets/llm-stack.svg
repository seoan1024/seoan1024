<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-label="Korean LLM stack diagram">
  <defs><linearGradient id="a" x1="0" x2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
  <rect width="1200" height="610" rx="24" fill="#0b1220" stroke="#334155"/>
  <text x="55" y="58" font-family="Inter,Segoe UI,Arial" font-size="28" font-weight="800" fill="#f8fafc">WHAT I WORK ON</text>
  <text x="55" y="88" font-family="Inter,Segoe UI,Arial" font-size="15" fill="#94a3b8">The pieces behind a home-built Korean LLM</text>
  <g font-family="Inter,Segoe UI,Arial">
    <g transform="translate(65 125)"><rect width="330" height="125" rx="18" fill="#111827" stroke="#4c1d95"/><text x="22" y="34" font-size="13" font-weight="800" fill="#a78bfa">MODEL</text><text x="22" y="68" font-size="22" font-weight="800" fill="#fff">Transformer</text><text x="22" y="96" font-size="14" fill="#94a3b8">RoPE · Attention · ~1.09B params</text></g>
    <g transform="translate(435 125)"><rect width="330" height="125" rx="18" fill="#111827" stroke="#155e75"/><text x="22" y="34" font-size="13" font-weight="800" fill="#67e8f9">DATA</text><text x="22" y="68" font-size="22" font-weight="800" fill="#fff">Korean Corpus</text><text x="22" y="96" font-size="14" fill="#94a3b8">Dataset pipeline · caching · SFT</text></g>
    <g transform="translate(805 125)"><rect width="330" height="125" rx="18" fill="#111827" stroke="#166534"/><text x="22" y="34" font-size="13" font-weight="800" fill="#86efac">TRAINING</text><text x="22" y="68" font-size="22" font-weight="800" fill="#fff">Optimization</text><text x="22" y="96" font-size="14" fill="#94a3b8">BF16 · 8-bit AdamW · monitoring</text></g>
    <g transform="translate(65 285)"><rect width="510" height="240" rx="18" fill="#0f172a" stroke="#334155"/><text x="22" y="36" font-size="13" font-weight="800" fill="#c4b5fd">TRAIN LOOP</text><text x="22" y="74" font-size="22" font-weight="800" fill="#f8fafc">Build → Train → Analyze</text><text x="22" y="107" font-size="16" fill="#cbd5e1">01  모델/데이터 설정</text><text x="22" y="138" font-size="16" fill="#cbd5e1">02  학습 실행 + 로그 저장</text><text x="22" y="169" font-size="16" fill="#cbd5e1">03  샘플 출력과 loss 확인</text><text x="22" y="200" font-size="16" fill="#cbd5e1">04  원인 추적 + 설정 수정</text></g>
    <g transform="translate(625 285)"><rect width="510" height="240" rx="18" fill="#0f172a" stroke="#334155"/><text x="22" y="36" font-size="13" font-weight="800" fill="#67e8f9">ENGINEERING MINDSET</text><text x="22" y="74" font-size="22" font-weight="800" fill="#f8fafc">실패도 학습 데이터입니다.</text><text x="22" y="110" font-size="15" fill="#cbd5e1">모델이 이상한 결과를 내면 그 결과를 기록합니다.</text><text x="22" y="142" font-size="15" fill="#cbd5e1">로그를 비교하고, 가설을 세우고, 다시 학습합니다.</text><text x="22" y="180" font-size="15" fill="#94a3b8">결과보다 재현 가능한 과정과 원인 분석을 중시합니다.</text></g>
  </g>
</svg>