<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I'm Seoan</title>
  <desc id="desc">Seoan is a student programmer who enjoys learning by building and is interested in AI and Korean language models.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#17133a"/>
      <stop offset="1" stop-color="#071925"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="28"/></filter>
    <style>
      @media (prefers-reduced-motion: no-preference) {
        .ambient { animation: breathe 3s ease-in-out infinite alternate; }
        .ambient-delayed { animation-delay: -1.5s; }
        .network-lines { stroke-dasharray: 10 14; animation: flow 7s linear infinite; }
        .network-nodes { animation: shimmer 1.8s ease-in-out infinite alternate; }
        .hello { transform-box: fill-box; transform-origin: left center; animation: hello 2.4s ease-in-out infinite; }
        .tagline { animation: tagline 5s ease-in-out infinite; }
        .interests { animation: interests 2.8s ease-in-out infinite alternate; }
        .orbit { transform-box: fill-box; transform-origin: center; animation: orbit 12s linear infinite; }
      }
      @keyframes breathe { to { opacity: .38; transform: scale(1.22); } }
      @keyframes flow { to { stroke-dashoffset: -96; } }
      @keyframes shimmer { to { opacity: .25; } }
      @keyframes hello { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-12px) rotate(-1deg); } }
      @keyframes tagline { 0%,12% { opacity: 0; transform: translateX(-45px); } 24%,76% { opacity: 1; transform: translateX(0); } 88%,100% { opacity: 0; transform: translateX(45px); } }
      @keyframes interests { from { letter-spacing: 0; fill: #cbd5e1; } to { letter-spacing: 2px; fill: #67e8f9; } }
      @keyframes orbit { to { transform: rotate(360deg); } }
    </style>
  </defs>
  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <circle class="ambient" cx="1030" cy="150" r="120" fill="#22d3ee" opacity=".12" filter="url(#glow)"/>
  <circle class="ambient ambient-delayed" cx="845" cy="92" r="100" fill="#8b5cf6" opacity=".15" filter="url(#glow)"/>
  <g class="orbit">
  <g class="network-lines" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".75">
    <path d="M765 190h95l48-52h96l46 52h96"/>
    <path d="M830 222h100l45-48h110l45 48h90"/>
    <path d="M923 112h66l38 40h93"/>
  </g>
  <g class="network-nodes" fill="url(#accent)">
    <circle cx="765" cy="190" r="5"/><circle cx="860" cy="190" r="5"/><circle cx="908" cy="138" r="5"/>
    <circle cx="1004" cy="138" r="5"/><circle cx="1050" cy="190" r="5"/><circle cx="1146" cy="190" r="5"/>
    <circle cx="830" cy="222" r="5"/><circle cx="930" cy="222" r="5"/><circle cx="975" cy="174" r="5"/>
    <circle cx="1085" cy="174" r="5"/><circle cx="1130" cy="222" r="5"/>
  </g>
  </g>
  <text x="72" y="74" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#a5b4fc">A LITTLE ABOUT ME</text>
  <text class="hello" x="68" y="154" font-family="Segoe UI,Arial,sans-serif" font-size="62" font-weight="800" fill="#f8fafc">안녕하세요, 서안입니다!</text>
  <text class="tagline" x="72" y="199" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="url(#accent)">만들면서 배우는 중학생 프로그래머</text>
  <text class="interests" x="72" y="245" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#cbd5e1">AI · 코딩 · 한국어 언어 모델 · 호기심</text>
  <rect x="1" y="1" width="1198" height="298" rx="27" fill="none" stroke="#ffffff" stroke-opacity=".12"/>
</svg>
