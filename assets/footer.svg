<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">Build, train, measure, improve</title>
  <desc id="desc">A reminder to evolve Korean-llm research into a modular, measured Hanok LLM.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <style>
      @media (prefers-reduced-motion: no-preference) {
        .footer-flow { stroke-dasharray: 12 16; animation: flow 8s linear infinite; }
        .footer-dot { animation: pulse 1s ease-in-out infinite alternate; }
        .footer-title { animation: title 2s ease-in-out infinite; }
        .footer-subtitle { animation: slide 5s ease-in-out infinite; }
      }
      @keyframes flow { to { stroke-dashoffset: -112; } }
      @keyframes pulse { to { opacity: .2; r: 11px; } }
      @keyframes title { 0%,100% { transform: translateY(0); fill: #f8fafc; } 50% { transform: translateY(-9px); fill: #67e8f9; } }
      @keyframes slide { 0%,15% { opacity: .15; letter-spacing: 3px; } 55%,85% { opacity: 1; letter-spacing: 0; } 100% { opacity: .15; letter-spacing: 3px; } }
    </style>
  </defs>
  <rect width="1200" height="190" rx="24" fill="#0b1220" stroke="#334155"/>
  <path class="footer-flow" d="M40 145c180-65 270 35 440-18s275-52 420 0 200 24 300-8" fill="none" stroke="url(#accent)" stroke-width="3" opacity=".65"/>
  <text class="footer-title" x="600" y="77" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="800" fill="#f8fafc">KEEP BUILDING, KEEP LEARNING</text>
  <text class="footer-subtitle" x="600" y="108" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#94a3b8">호기심을 따라 만들고, 배우고, 다시 도전합니다.</text>
  <circle class="footer-dot" cx="600" cy="145" r="7" fill="#22d3ee"/><circle cx="574" cy="145" r="4" fill="#8b5cf6"/><circle cx="626" cy="145" r="4" fill="#8b5cf6"/>
</svg>
