<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Seoan — student programmer and AI learner</title>
  <desc id="desc">A personal introduction to Seoan, a curious programmer who likes learning by building.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080d1c"/><stop offset=".58" stop-color="#171333"/><stop offset="1" stop-color="#071b24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
    <style>
      @media (prefers-reduced-motion: no-preference) {
        .ambient { animation: breathe 3s ease-in-out infinite alternate; }
        .ambient-delayed { animation-delay: -1.5s; }
        .project-flow { stroke-dasharray: 8 10; animation: flow 5s linear infinite; }
        .headline { transform-box: fill-box; transform-origin: left center; animation: bounce 2.3s ease-in-out infinite; }
        .bio-line { animation: reveal 4s ease-in-out infinite; }
        .float-tag { animation: float 2s ease-in-out infinite alternate; }
        .float-tag-2 { animation-delay: -.7s; }
        .float-tag-3 { animation-delay: -1.4s; }
      }
      @keyframes breathe { to { opacity: .38; transform: scale(1.2); } }
      @keyframes flow { to { stroke-dashoffset: -72; } }
      @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      @keyframes reveal { 0%,15% { opacity: 0; transform: translateX(-35px); } 30%,75% { opacity: 1; transform: translateX(0); } 90%,100% { opacity: 0; transform: translateX(30px); } }
      @keyframes float { to { transform: translateY(-9px); } }
    </style>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <circle class="ambient" cx="1010" cy="95" r="130" fill="#7c3aed" opacity=".17" filter="url(#blur)"/>
  <circle class="ambient ambient-delayed" cx="1080" cy="330" r="135" fill="#06b6d4" opacity=".13" filter="url(#blur)"/>
  <g opacity=".12" stroke="#94a3b8">
    <path d="M0 84h1200M0 168h1200M0 252h1200M0 336h1200"/>
    <path d="M100 0v420M220 0v420M340 0v420M460 0v420M580 0v420M700 0v420M820 0v420M940 0v420M1060 0v420"/>
  </g>
  <rect x="58" y="48" width="1084" height="324" rx="26" fill="#0b1220" fill-opacity=".78" stroke="#334155"/>
  <rect x="92" y="84" width="8" height="105" rx="4" fill="url(#accent)"/>
  <text x="124" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#a5b4fc">A CURIOUS STUDENT PROGRAMMER</text>
  <text class="headline" x="124" y="164" font-family="Segoe UI,Arial,sans-serif" font-size="43" font-weight="800" fill="#f8fafc">개발 과정</text>
  <text class="bio-line" x="124" y="207" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#cbd5e1">직접 만들고 실험하며 배우는 중입니다.</text>
  <text class="bio-line" x="124" y="238" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#94a3b8" style="animation-delay:-2s">I learn by building, experimenting, and staying curious.</text>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">
    <rect class="float-tag" x="124" y="276" width="132" height="34" rx="17" fill="#1e293b" stroke="#475569"/>
    <text x="190" y="298" text-anchor="middle" fill="#e2e8f0">PURE PYTORCH</text>
    <rect class="float-tag float-tag-2" x="268" y="276" width="126" height="34" rx="17" fill="#1e293b" stroke="#475569"/>
    <text x="331" y="298" text-anchor="middle" fill="#e2e8f0">MODULAR</text>
    <rect class="float-tag float-tag-3" x="406" y="276" width="142" height="34" rx="17" fill="#1e293b" stroke="#475569"/>
    <text x="477" y="298" text-anchor="middle" fill="#e2e8f0">EFFICIENCY</text>
  </g>
  <g transform="translate(790 112)" font-family="Segoe UI,Arial,sans-serif">
    <rect width="300" height="204" rx="20" fill="#0f172a" stroke="#475569"/>
    <text x="24" y="36" font-size="13" font-weight="700" letter-spacing="1" fill="#94a3b8">WHAT I LIKE TO DO</text>
    <text x="24" y="78" font-size="22" font-weight="800" fill="#c4b5fd">Build things</text>
    <text x="24" y="101" font-size="14" fill="#94a3b8">Code · learn · experiment</text>
    <path class="project-flow" d="M24 121h238" stroke="#22d3ee"/>
    <text x="24" y="154" font-size="22" font-weight="800" fill="#67e8f9">Stay curious</text>
    <text x="24" y="179" font-size="14" fill="#cbd5e1">Try · understand · improve</text>
  </g>
  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
</svg>
