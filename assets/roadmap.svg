<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Seoan AI roadmap">
  <rect width="1200" height="440" rx="24" fill="#0b1220" stroke="#334155"/>
  <text x="55" y="58" font-family="Inter,Segoe UI,Arial" font-size="28" font-weight="800" fill="#f8fafc">ROADMAP</text>
  <text x="55" y="88" font-family="Inter,Segoe UI,Arial" font-size="15" fill="#94a3b8">What comes after getting the model to train</text>
  <g font-family="Inter,Segoe UI,Arial">
    <g transform="translate(60 125)"><rect width="250" height="220" rx="18" fill="#111827" stroke="#7c3aed"/><text x="24" y="38" font-size="13" font-weight="800" fill="#a78bfa">01 / NOW</text><text x="24" y="76" font-size="22" font-weight="800" fill="#fff">Korean-llm-v4</text><text x="24" y="112" font-size="14" fill="#cbd5e1">학습 안정화</text><text x="24" y="138" font-size="14" fill="#cbd5e1">출력 품질 분석</text><text x="24" y="164" font-size="14" fill="#cbd5e1">로그 기반 튜닝</text><text x="24" y="195" font-size="13" fill="#94a3b8">1.09B-scale experiment</text></g>
    <g transform="translate(335 125)"><rect width="250" height="220" rx="18" fill="#111827" stroke="#0ea5e9"/><text x="24" y="38" font-size="13" font-weight="800" fill="#67e8f9">02 / NEXT</text><text x="24" y="76" font-size="22" font-weight="800" fill="#fff">Quality</text><text x="24" y="112" font-size="14" fill="#cbd5e1">한국어 생성 품질</text><text x="24" y="138" font-size="14" fill="#cbd5e1">SFT 데이터 개선</text><text x="24" y="164" font-size="14" fill="#cbd5e1">평가 기준 정리</text><text x="24" y="195" font-size="13" fill="#94a3b8">Better outputs, not only loss</text></g>
    <g transform="translate(610 125)"><rect width="250" height="220" rx="18" fill="#111827" stroke="#14b8a6"/><text x="24" y="38" font-size="13" font-weight="800" fill="#5eead4">03 / BUILD</text><text x="24" y="76" font-size="22" font-weight="800" fill="#fff">Inference</text><text x="24" y="112" font-size="14" fill="#cbd5e1">추론 최적화</text><text x="24" y="138" font-size="14" fill="#cbd5e1">KV Cache 활용</text><text x="24" y="164" font-size="14" fill="#cbd5e1">사용 가능한 API</text><text x="24" y="195" font-size="13" fill="#94a3b8">From weights to usable system</text></g>
    <g transform="translate(885 125)"><rect width="250" height="220" rx="18" fill="#111827" stroke="#22d3ee"/><text x="24" y="38" font-size="13" font-weight="800" fill="#67e8f9">04 / GOAL</text><text x="24" y="76" font-size="22" font-weight="800" fill="#fff">Real Users</text><text x="24" y="112" font-size="14" fill="#cbd5e1">사람이 실제로 사용하는 모델</text><text x="24" y="138" font-size="14" fill="#cbd5e1">지속적인 개선</text><text x="24" y="164" font-size="14" fill="#cbd5e1">더 큰 AI 시스템으로 확장</text><text x="24" y="195" font-size="13" fill="#94a3b8">Learn → build → ship</text></g>
  </g>
</svg>